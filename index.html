<style>
html,body{margin:0;padding:0;background:#F7F5F0;}
/* ===== 고객 전용 페이지 ===== */
.cp{--cp-ink:#1F1A1C;--cp-soft:#5E5750;--cp-paper:#F4F1EA;--cp-card:#FFFFFF;--cp-line:#E2DBCD;--cp-wine:#5C1F29;--cp-gold:#A9823C;--cp-gold-s:#F2E7CF;--cp-sage:#4F6F52;--cp-coral:#B0432E;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--cp-ink);background:var(--cp-paper);min-height:100vh;font-variant-numeric:tabular-nums;max-width:640px;margin:0 auto;position:relative;}
.cp *{box-sizing:border-box;}
.cp-busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cp-gold),var(--cp-wine));z-index:60;animation:cpBusy 1s linear infinite;}
@keyframes cpBusy{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.cp-preview{background:var(--cp-gold);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;display:flex;justify-content:center;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
.cp-preview button{border:1px solid #fff;background:none;color:#fff;border-radius:999px;padding:3px 10px;font:inherit;cursor:pointer;}
.cp-top{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#FBF9F4;border-bottom:1px solid var(--cp-line);}
.cp-top img{height:30px;}
.cp-brand{font-size:11px;font-weight:800;letter-spacing:.32em;color:var(--cp-ink);}
.cp-brand small{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;letter-spacing:.06em;font-size:12px;color:var(--cp-gold);}
.cp-top-acts{margin-left:auto;display:flex;gap:6px;}
.cp-top-acts button{border:1px solid var(--cp-line);background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;color:var(--cp-ink);}
.cp-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--cp-paper);position:sticky;top:0;z-index:10;scrollbar-width:none;border-bottom:1px solid var(--cp-line);}
.cp-nav::-webkit-scrollbar{display:none;}
.cp-nav button{flex:0 0 auto;border:1px solid var(--cp-line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--cp-soft);cursor:pointer;}
.cp-main{padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px;}
.cp-hero{background:linear-gradient(160deg,var(--cp-wine) 0%,#3B1219 100%);color:#F7F0E6;border-radius:18px;padding:26px 20px 20px;text-align:center;box-shadow:0 10px 26px rgba(92,31,41,.25);}
.cp-hello{font-size:13px;letter-spacing:.08em;color:var(--cp-gold-s);font-weight:700;}
.cp-dday{font-family:'Cormorant Garamond','Noto Serif KR',serif;font-size:64px;font-weight:700;line-height:1.05;letter-spacing:.04em;margin:10px 0 4px;
  background:linear-gradient(180deg,#FFF6E3 0%,#F2DDB0 38%,#D4AF6A 62%,#F5E3BC 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));font-variant-numeric:lining-nums;}
.cp-dday.done{font-family:'Noto Serif KR',serif;font-size:40px;letter-spacing:.02em;}
.cp-dday::after{content:'';display:block;width:42px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,#D4AF6A,transparent);}
.cp-dsub{font-size:12.5px;color:#E7D9C2;}
.cp-when{margin:14px auto 16px;font-size:14px;line-height:1.7;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18);padding:10px 0;}
.cp-hero-acts{display:flex;gap:8px;}
.cp-hero-acts .cp-btn{flex:1;}
.cp-card{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:16px;padding:18px 16px;scroll-margin-top:62px;}
.cp-card h2{font-size:16px;margin:0 0 12px;font-weight:800;}
.cp-desc{font-size:13px;line-height:1.7;color:var(--cp-soft);margin:0 0 12px;}
.cp-note{font-size:11.5px;color:var(--cp-soft);margin:10px 0;line-height:1.6;}
.cp-empty{font-size:13px;color:var(--cp-soft);background:#FAF7F1;border:1px dashed var(--cp-line);border-radius:12px;padding:16px;text-align:center;}
.cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--cp-line);background:#fff;color:var(--cp-ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer;}
.cp-btn.primary{background:var(--cp-wine);border-color:var(--cp-wine);color:#fff;}
.cp-btn.gold{background:var(--cp-gold);border-color:var(--cp-gold);color:#fff;}
.cp-hero .cp-btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff;}
.cp-btn.kakao{background:#FEE500;border-color:#FEE500;color:#191600;}
.cp-btn.wide{width:100%;margin-top:6px;}
.cp-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cp-dl{margin:0 0 6px;}
.cp-dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #F0EBE1;font-size:13.5px;}
.cp-dl div:last-child{border-bottom:none;}
.cp-dl dt{color:var(--cp-soft);flex:0 0 auto;}
.cp-dl dd{margin:0;text-align:right;font-weight:600;}
.cp-dl b.ok{color:var(--cp-sage);} .cp-dl b.wait{color:var(--cp-coral);}
.cp-money{background:#FAF7F1;border-radius:12px;padding:8px 12px;margin-top:6px;}
.cp-money div{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px dashed #E8E1D3;}
.cp-money div:last-child{border-bottom:none;}
.cp-money div.minus b{color:var(--cp-coral);}
.cp-money div.sum{border-top:2px solid var(--cp-ink);border-bottom:2px solid var(--cp-ink);font-size:15.5px;margin:4px 0;}
.cp-money div.sum b{color:var(--cp-wine);font-size:17px;}
.cp-video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;}
.cp-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.cp-frame{margin-top:10px;border:1px solid var(--cp-line);border-radius:12px;overflow:hidden;height:560px;}
.cp-frame iframe{width:100%;height:100%;border:0;}
.cp-code{text-align:center;background:var(--cp-gold-s);border-radius:14px;padding:14px;margin-bottom:12px;}
.cp-code span{font-size:12px;color:var(--cp-soft);font-weight:700;}
.cp-code b{display:block;font-size:26px;letter-spacing:.08em;margin:2px 0 10px;color:var(--cp-wine);}
.cp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.cp-stats div{background:#FAF7F1;border-radius:12px;padding:10px;text-align:center;}
.cp-stats span{display:block;font-size:11.5px;color:var(--cp-soft);}
.cp-stats b{font-size:15px;}
.cp-stats small{display:block;font-size:10.5px;color:var(--cp-sage);font-weight:700;}
.cp-list div{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #F0EBE1;font-size:13.5px;}
.cp-list small{display:block;font-size:11px;color:var(--cp-soft);}
.cp-list em{font-style:normal;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:#EEE9DE;color:var(--cp-soft);}
.cp-list em.discount{background:#E6EFE6;color:var(--cp-sage);} .cp-list em.payback{background:var(--cp-gold-s);color:#7E5E22;}
.cp-notice p{font-size:13.5px;line-height:1.8;margin:0 0 8px;}
.cp-memo{background:#FAF7F1;border-radius:10px;padding:10px 12px;}
.cp-install{border:1px solid var(--cp-line);background:#fff;border-radius:999px;padding:10px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.cp-foot{text-align:center;padding:26px 0 40px;font-size:11px;color:var(--cp-soft);line-height:1.7;}
.cp-foot img{height:26px;display:block;margin:0 auto 6px;opacity:.85;}
.cp-foot b{display:block;letter-spacing:.32em;font-size:10.5px;color:var(--cp-ink);}
.cp-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F1A1C;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center;}
.cp-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.cp-side{display:inline-block;background:var(--cp-gold);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 9px;margin-right:6px;vertical-align:middle;}

/* ================= 접속 메인화면 (모먼트웍스 로고) ================= */
.mw-entry{position:fixed;inset:0;z-index:500;overflow-y:auto;background:#F7F5F0;background-image:radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #F7F5F0 55%, #EFEBE3 100%);color:#1A1618;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;padding:56px 22px;box-sizing:border-box;}
.mw-entry::before,.mw-entry::after{content:"";position:fixed;pointer-events:none;}
.mw-entry::before{inset:14px;border:1px solid rgba(26,22,24,.16);}
.mw-entry::after{inset:20px;border:1px solid rgba(169,130,60,.30);}
.mw-entry *{box-sizing:border-box;}
.mw-entry-inner{position:relative;z-index:1;width:100%;max-width:340px;text-align:center;animation:mwFade 1s cubic-bezier(.2,.7,.2,1) both;margin:auto 0;}
.mw-entry-logo{display:block;width:236px;max-width:64vw;height:auto;margin:0 auto;user-select:none;-webkit-user-drag:none;}
.mw-entry-label{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px 0 28px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#7E776C;padding-left:.22em;}
.mw-entry-label::before,.mw-entry-label::after{content:"";width:26px;height:1px;background:#C9B48A;}
.mw-tabs{display:flex;justify-content:center;gap:30px;margin:0 0 28px;}
.mw-tabs button{appearance:none;background:none;border:none;border-bottom:1px solid transparent;padding:0 2px 7px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.14em;color:#A39C90;cursor:pointer;transition:color .2s,border-color .2s;}
.mw-tabs button:hover{color:#1A1618;}
.mw-tabs button.active{color:#1A1618;border-bottom-color:#1A1618;}
.mw-field{text-align:left;margin-bottom:20px;}
.mw-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;color:#8A8378;margin-bottom:4px;}
.mw-field input{width:100%;border:none;border-bottom:1px solid #CFC8BA;border-radius:0;background:transparent;padding:10px 2px;font-family:inherit;font-size:15.5px;color:#1A1618;outline:none;transition:border-color .25s;-webkit-appearance:none;}
.mw-field input:focus{border-bottom-color:#1A1618;}
.mw-field input::placeholder{color:#C2BBAE;}
.mw-field input.code{text-align:center;letter-spacing:.28em;font-weight:600;font-size:19px;text-transform:uppercase;padding-left:.28em;}
.mw-note{font-size:12.5px;line-height:1.8;color:#6F685E;margin:0 0 24px;}
.mw-check{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#6F685E;margin:0 0 14px;cursor:pointer;}
.mw-check input{accent-color:#1A1618;width:14px;height:14px;margin:0;}
.mw-error{color:#A8432F;font-size:12px;line-height:1.55;min-height:18px;margin:2px 0 12px;}
.mw-btn{width:100%;border:1px solid #1A1618;border-radius:0;background:#1A1618;color:#F7F5F0;padding:15px 14px;font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.18em;cursor:pointer;transition:background .25s,color .25s;}
.mw-btn:hover{background:transparent;color:#1A1618;}
.mw-btn:disabled{opacity:.45;cursor:default;}
.mw-link{display:inline-block;background:none;border:none;margin-top:20px;font-family:inherit;font-size:11.5px;letter-spacing:.06em;color:#8A8378;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.mw-foot{margin:44px 0 0;font-size:10px;font-weight:600;letter-spacing:.3em;color:#ADA699;padding-left:.3em;}
.mw-loading{font-size:12px;letter-spacing:.26em;color:#8A8378;margin-top:36px;padding-left:.26em;}
.mw-loading::after{content:"";display:block;width:34px;height:1px;background:#1A1618;margin:16px auto 0;animation:mwLine 1.4s ease-in-out infinite;}
@keyframes mwFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes mwLine{0%,100%{transform:scaleX(.3);opacity:.35;}50%{transform:scaleX(1);opacity:1;}}
@media (max-height:640px){.mw-entry-logo{width:170px;} .mw-entry-label{margin:22px 0 20px;} .mw-foot{margin-top:28px;}}
/* 상단 모노그램 */
.mw-topmark{height:52px;width:auto;display:block;opacity:.95;}
.mw-topwrap{display:flex;align-items:center;gap:18px;}
.mw-topwrap .mw-topdiv{width:1px;align-self:stretch;background:rgba(245,239,230,.28);margin:4px 0;}
.pp-mark{height:34px;width:auto;display:block;opacity:.95;}
.pp-brandrow{display:flex;align-items:center;gap:12px;}
@media (max-width:560px){.mw-topmark{height:40px;} .mw-topwrap{gap:12px;}}
.mw-install{display:block;margin:18px auto 0;border:1px solid #CDBF9F;background:#fff;color:#1A1618;border-radius:999px;padding:10px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.mw-ig{position:fixed;inset:0;z-index:100000;display:flex;align-items:flex-end;justify-content:center;}
.mw-ig-bg{position:absolute;inset:0;background:rgba(20,16,18,.5);}
.mw-ig-card{position:relative;background:#F7F5F0;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.mw-ig-card img{width:64px;height:64px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.mw-ig-card h3{margin:10px 0 4px;font-size:18px;}
.mw-ig-sub{font-size:12.5px;color:#6F685E;margin:0 0 12px;}
.mw-ig-card ol{text-align:left;margin:0 0 14px;padding:0;list-style:none;counter-reset:s;}
.mw-ig-card li{counter-increment:s;position:relative;padding:10px 12px 10px 44px;background:#fff;border:1px solid #E5DFD3;border-radius:12px;margin-bottom:8px;font-size:14px;line-height:1.5;}
.mw-ig-card li::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#5C1F29;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.mw-ico{display:inline-block;border:1px solid #bbb;border-radius:4px;padding:0 4px;font-size:12px;}

</style>

  const parseD = s => { const p=String(s||'').split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate()); }
  function fdate(s, long){ if(!s) return '-'; const d=parseD(s); return long ? `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})` : `${pd(d.getMonth()+1)}.${pd(d.getDate())}(${WD[d.getDay()]})`; }
  function dday(s){ if(!s) return null; const n = Math.round((parseD(s) - parseD(todayStr()))/86400000); return n; }
  function toast(msg){
    let t=document.getElementById('cpToast');
    if(!t){ t=document.createElement('div'); t.id='cpToast'; t.className='cp-toast'; document.body.appendChild(t); }

  /* ---------- 캘린더 알림 (.ics) ---------- */
  function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function buildIcs(){
    const w = view.wedding; if(!w.date) return '';
    const t = /^\d{1,2}:\d{2}/.test(w.time||'') ? w.time : '12:00';
    const [hh,mm] = t.split(':').map(Number);
    const end = new Date(2000,0,1,hh,mm+120);
    const dt = (d, h, m)=> d.replace(/-/g,'')+'T'+pd(h)+pd(m)+'00';
    const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const desc = `모먼트웍스 축의대 · ${w.venue} ${w.hall}\n고객 전용 페이지: ${location.href.split('#')[0]}`;
    const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MomentWorks//Customer//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH',
      'BEGIN:VEVENT','UID:wedding-'+(view.client.code||'mw')+'@momentworks','DTSTAMP:'+stamp,
      'DTSTART;TZID=Asia/Seoul:'+dt(w.date,hh,mm),'DTEND;TZID=Asia/Seoul:'+dt(w.date,end.getHours(),end.getMinutes()),
      'SUMMARY:'+icsEsc(`💍 ${view.client.name}님 예식`),'LOCATION:'+icsEsc((w.venue+' '+w.hall).trim()),'DESCRIPTION:'+icsEsc(desc),
      'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('예식 일주일 전이에요 · 축의대 운영 설정서를 확인해주세요'),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('내일 예식이에요 · 모먼트웍스가 함께할게요'),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('오늘 예식이에요 · 축하드려요 💐'),'END:VALARM',
      'END:VEVENT','END:VCALENDAR'];
    return L.join('\r\n');
  }
  function downloadIcs(){
    const s = buildIcs(); if(!s){ toast('예식 일정이 아직 없어요'); return; }
    const blob = new Blob([s], {type:'text/calendar;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'momentworks-wedding.ics';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('캘린더에 추가하면 7일 전 · 1일 전 · 당일에 알림이 와요');
  }
  function googleCalUrl(){
    const w = view.wedding; if(!w.date) return '';
    const t = /^\d{1,2}:\d{2}/.test(w.time||'') ? w.time : '12:00'; const [hh,mm] = t.split(':').map(Number);
    const end = new Date(2000,0,1,hh,mm+120);
    const d = w.date.replace(/-/g,'');
    const q = new URLSearchParams({action:'TEMPLATE', text:`💍 ${view.client.name}님 예식`, dates:`${d}T${pd(hh)}${pd(mm)}00/${d}T${pd(end.getHours())}${pd(end.getMinutes())}00`, ctz:'Asia/Seoul', location:(w.venue+' '+w.hall).trim(), details:'모먼트웍스 축의대 · '+location.href.split('#')[0]});
    return 'https://calendar.google.com/calendar/render?'+q.toString();
  }
  function ytEmbed(url){
    const u = String(url||'').trim(); if(!u) return '';
    const m = u.match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);
    return m ? 'https://www.youtube.com/embed/'+m[1]+'?rel=0&playsinline=1' : '';

  let dlBusy = false;
  async function downloadDoc(btn){
    if(dlBusy) return;
    if(!H.onDownload){ toast('미리보기에서는 다운로드할 수 없어요'); return; }
    dlBusy = true; const old = btn ? btn.textContent : ''; if(btn){ btn.textContent = '받는 중…'; btn.disabled = true; }
    try{
      const f = await H.onDownload();
      const bin = atob(f.data), arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], {type: f.mime || 'application/pdf'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = f.name || '모먼트웍스_계약서.pdf'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
      toast(/KAKAOTALK/i.test(navigator.userAgent) ? '저장이 안 되면 ⋮ 메뉴 → 다른 브라우저로 열기 후 다시 눌러주세요' : '계약서를 저장했어요');
    }catch(err){ toast(err.message || '계약서를 받지 못했어요'); }
    finally{ dlBusy = false; if(btn){ btn.textContent = old; btn.disabled = false; } }
  }

    if(a==='copyCode'){ if(await copyText(view.referral.code)) toast('짝꿍코드를 복사했어요'); return; }
    if(a==='shareCode'){
      const text = `💍 모먼트웍스 축의대 대행 서비스\n계약할 때 짝꿍코드 [${view.referral.code}] 를 입력하면 할인을 받을 수 있어요!\n상담: ${view.info.kakao}`;
      if(navigator.share){ try{ await navigator.share({text}); }catch(_){} } else if(await copyText(text)) toast('공유 문구를 복사했어요');
      return;
    }
    if(a==='contractDownload'){ downloadDoc(el); return; }
    if(a==='copyGift'){ if(await copyText(view.live.giftCode)) toast('현황판 코드를 복사했어요'); return; }
    if(a==='shareGift'){
      const text = `💌 ${view.client.name}님 ${view.client.sideLabel? view.client.sideLabel+' ' : ''}실시간 축의 현황\n아래 링크를 누르면 바로 열려요 (현황판 코드: ${view.live.giftCode})\n${view.live.giftUrl}`;
      if(navigator.share){ try{ await navigator.share({text}); }catch(_){} } else if(await copyText(text)) toast('현황판 링크를 복사했어요');
      return;
    }
    if(a==='shareLive'){
      const text = `💍 ${view.client.name}님 예식 라이브\n${fdate(view.wedding.date, true)} ${view.wedding.time}\n${view.live.youtube}`;
      if(navigator.share){ try{ await navigator.share({text}); }catch(_){} } else if(await copyText(text)) toast('라이브 링크를 복사했어요');
      return;
    }
    if(a==='refresh'){
      if(busy || !H.onRefresh) return; busy=true; render();
      try{ const nv = await H.onRefresh(); if(nv) view = nv; toast('최신 정보로 업데이트했어요'); }catch(err){ toast(err.message||'불러오지 못했어요'); }
      finally{ busy=false; render(); }
      return;
    }
    if(a==='logout'){ if(H.onLogout) H.onLogout(); return; }
    if(a==='closePreview'){ if(H.onClosePreview) H.onClosePreview(); return; }
    if(a==='install'){ if(H.onInstall) H.onInstall(); return; }
  }
  function mount(el, v, handlers){ unmount(); root=el; view=v; H=handlers||{}; busy=false; giftOpen=false; root.addEventListener('click', onClick); render(); }
  function update(v){ view=v; render(); }
  function unmount(){ if(root){ root.removeEventListener('click', onClick); root.innerHTML=''; } root=null; view=null; }
  return {mount, update, unmount, toast, buildIcs:()=>buildIcs()};
})();

</script>
<script>
/* =========================================================
   모먼트웍스 고객 전용 페이지 (계약자별 접속코드)
   - 서버: 통합관리시스템과 같은 구글 Apps Script 웹 앱 (customerView)
   - 본인 계약 정보만 조회 · 다른 계약자 정보는 이름 일부만 가려서 표시(짝꿍코드 추천)
   - 서버 주소는 통합관리시스템과 같은 웹 앱 주소가 기본으로 들어 있어서
     고객은 접속코드만 입력하면 바로 접속돼요.
     (초대 링크의 #api=... 나 "서버 주소 변경"으로 다른 주소를 쓸 수도 있어요)
========================================================= */
const OFFICE_API_URL = 'https://script.google.com/macros/s/AKfycby5hXIA_hj4wLSKUyrigg_f6H3U8IGfJ9j-6To-Wzhb8WU0RB0H8LLd8_CkziE9GYlY/exec';
const LS_API = 'mwcp_api', LS_CODE = 'mwcp_code';

const app = document.getElementById('app');
let API = '', CODE = '', lastLoad = 0;

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normCode(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

function readHash(){
  const h = location.hash.replace(/^#/,''); if(!h) return {};
  const out = {}; h.split('&').forEach(p=>{ const i=p.indexOf('='); if(i>0) out[decodeURIComponent(p.slice(0,i))] = decodeURIComponent(p.slice(i+1)); });
  return out;
}
function apiUrl(params){ const u = new URL(API); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); return u.toString(); }

async function fetchView(code){
  try{ return await fetchViewOnce(code); }
  catch(ex){
    if(OFFICE_API_URL && API !== OFFICE_API_URL && ex.network){ API = OFFICE_API_URL; ls(LS_API, null); return await fetchViewOnce(code); }
    throw ex;
  }
}
async function fetchViewOnce(code){
  let res;
  try{ res = await fetch(apiUrl({action:'customerView', code}), {method:'GET'}); }
  catch(e){ const er = new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해주세요'); er.network = true; throw er; }
  let j; try{ j = await res.json(); }catch(e){ const er = new Error('서버 응답을 읽지 못했어요. 잠시 후 다시 시도해주세요'); er.network = true; throw er; }
  if(Array.isArray(j)) throw new Error('서버 점검 중이에요. 잠시 후 다시 시도해주세요');
  if(!j || !j.ok) throw new Error((j && j.error) || '정보를 불러오지 못했어요');
  lastLoad = Date.now();
  return j;
}
async function fetchContractFile(code){
  let res, j;
  try{ res = await fetch(apiUrl({action:'customerFile', code}), {method:'GET'}); }
  catch(e){ throw new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해주세요'); }
  try{ j = await res.json(); }catch(e){ throw new Error('서버 응답을 읽지 못했어요. 잠시 후 다시 시도해주세요'); }
  if(!j || !j.ok || !j.data) throw new Error((j && j.error) || '계약서를 받지 못했어요. 서버 스크립트가 최신인지 확인해주세요');
  return j;
}
async function postOp(op, ops){
  // light: 서버는 저장만 하고 바로 응답 (화면은 이미 반영돼 있음) · ops: 여러 건을 한 번에 저장
  let res;
  try{ res = await fetch(apiUrl({action:'partnerUpdate'}), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(ops ? {code: CODE, ops, light: true} : {code: CODE, op, light: true})}); }
  catch(e){ const er = new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요'); er.network = true; throw er; }
  let j; try{ j = await res.json(); }catch(e){ const er = new Error('서버 응답을 읽지 못했어요'); er.network = true; throw er; }
  if(!j || !j.ok) throw new Error((j && j.error) || '저장하지 못했어요');
  lastLoad = Date.now();
  return ops ? j : (j.view || null);
}

function entryShell(label, inner){
  return `<div class="mw-entry"><div class="mw-entry-inner">
    <img class="mw-entry-logo" src="${MW_LOGO_FULL}" alt="Moment Works · Managing Meaningful Moments">
    <p class="mw-entry-label">${esc(label)}</p>
    ${inner}
    ${isInstalled()? '' : '<button class="mw-install" type="button" onclick="installApp()">📲 홈 화면에 바로가기 추가</button>'}
    <p class="mw-foot">© MOMENT WORKS</p>
  </div></div>`;
}
function screenSetup(msg){
  CustomerPortal.unmount();
  app.innerHTML = entryShell('서버 연결', `<form id="setupForm">
    <p class="mw-note">모먼트웍스에서 받은 링크로 접속하면 자동으로 설정돼요.</p>
    <div class="mw-field"><label for="apiInput">서버 주소</label><input id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API)}"></div>
    <div class="mw-error" id="setupErr">${esc(msg||'')}</div>
    <button class="mw-btn" type="submit">저장하기</button>
    ${API?'<button class="mw-link" type="button" id="backBtn">로그인으로 돌아가기</button>':''}
  </form>`);
  document.getElementById('setupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const v = document.getElementById('apiInput').value.trim();
    const err = document.getElementById('setupErr');
    if(!/^https:\/\//.test(v)){ err.textContent='https:// 로 시작하는 주소를 입력해주세요'; return; }
    try{
      const res = await fetch(v + (v.includes('?')?'&':'?') + 'action=ping');
      const j = await res.json();
      if(Array.isArray(j) || !j || Number(j.version)<2) throw new Error('서버 스크립트가 최신이 아니에요. 통합관리시스템의 "분리 운영·설정"에서 스크립트를 업데이트해주세요');
    }catch(ex){ err.textContent = ex.message && ex.message.includes('v2') ? ex.message : '서버에 연결하지 못했어요. 주소를 확인해주세요'; return; }
    API = v; ls(LS_API, v === OFFICE_API_URL ? null : v); screenLogin();
  });
  const back = document.getElementById('backBtn'); if(back) back.addEventListener('click', ()=>screenLogin());
}

function screenLogin(msg, prefill){
  CustomerPortal.unmount();
  const saved = ls(LS_CODE) || '';
  app.innerHTML = entryShell('고객 전용 페이지', `<form id="loginForm">
    <p class="mw-note">모먼트웍스에서 받은 전용 접속코드를 입력하면<br>예식 정보 · 계약서 · 라이브 · 축의 현황을 한 번에 확인할 수 있어요 💐</p>
    <div class="mw-field"><label for="codeInput">접속코드</label><input class="code" id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-1234" value="${esc(prefill||saved)}"></div>
    <label class="mw-check"><input type="checkbox" id="rememberInput" checked> 이 기기에서 자동 로그인</label>
    <div class="mw-error" id="loginErr">${esc(msg||'')}</div>
    <button class="mw-btn" type="submit" id="loginBtn">내 예식 페이지 보기</button>
    <button class="mw-link" type="button" id="setupBtn" style="${OFFICE_API_URL?'opacity:.55;font-size:11px;':''}">${OFFICE_API_URL?'접속이 안 되면: 서버 주소 변경':'서버 주소 설정'}</button>
  </form>`);
  const sb = document.getElementById('setupBtn'); if(sb) sb.addEventListener('click', ()=>screenSetup());
  // 접속코드 입력 도우미: 대문자 · 4자리마다 하이픈
  const ci = document.getElementById('codeInput');
  ci.addEventListener('input', ()=>{ const raw = normCode(ci.value).slice(0, 12); const v = raw.replace(/(.{4})(?=.)/g, '$1-'); if(v !== ci.value) ci.value = v; });
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const code = document.getElementById('codeInput').value.trim();
    const err = document.getElementById('loginErr'), btn = document.getElementById('loginBtn');
    if(!normCode(code)){ err.textContent='접속코드를 입력해주세요'; return; }
    btn.disabled = true; btn.textContent = '확인 중…'; err.textContent='';
    try{
      const view = await fetchView(code);
      CODE = code;
      ls(LS_CODE, document.getElementById('rememberInput').checked ? code : null);
      openPortal(view);
    }catch(ex){ err.textContent = ex.message; btn.disabled=false; btn.textContent='내 예식 페이지 보기'; }
  });
  if(!prefill && !saved) setTimeout(()=>document.getElementById('codeInput').focus(), 50);
}

function deviceKind(){
  const ua = navigator.userAgent || '';
  if(/KAKAOTALK/i.test(ua)) return 'kakao';
  if(/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua)) return 'inapp';
  if(/iPhone|iPad|iPod/i.test(ua)) return /CriOS|FxiOS|EdgiOS|Whale/i.test(ua) ? 'ios-other' : 'ios';
  if(/Android/i.test(ua)) return /SamsungBrowser/i.test(ua) ? 'samsung' : 'android';
  return 'desktop';
}

/* 마지막 화면 데이터를 기기에 보관 → 다음 접속 때 즉시 표시 후 뒤에서 최신화 */
function viewKey(code){ return 'mwpo_view_' + normCode(code); }
function cacheView(v){ if(!v || !CODE) return; try{ localStorage.setItem(viewKey(CODE), JSON.stringify(v)); }catch(e){} }
function cachedView(code){ try{ const v = JSON.parse(localStorage.getItem(viewKey(code))||'null'); return (v && v.ok && v.wedding) ? v : null; }catch(e){ return null; } }
let _cacheT = null;
function cacheViewSoon(v){ clearTimeout(_cacheT); _cacheT = setTimeout(()=> cacheView(v), 400); }

function openPortal(view){
  app.innerHTML = '<div id="portalRoot"></div>';
  CustomerPortal.mount(document.getElementById('portalRoot'), view, {
    onRefresh: ()=> fetchView(CODE),
    onDownload: ()=> fetchContractFile(CODE),
    onCache: (v)=> cacheViewSoon(v),
    onInstall: ()=> installApp(),
    isInstalled: ()=> isInstalled(),
    onLogout: ()=>{ if(confirm('로그아웃할까요? 자동 로그인도 해제돼요.')){ try{ localStorage.removeItem(viewKey(CODE)); }catch(e){} ls(LS_CODE, null); CODE=''; screenLogin(); } }
  });
}

/* 다른 앱을 보다가 돌아오면 5분마다 자동 새로고침 */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState!=='visible' || !CODE || Date.now()-lastLoad < 5*60*1000) return;
  try{ const v = await fetchView(CODE); CustomerPortal.update(v); }catch(e){ /* 조용히 무시 */ }
});

(async function boot(){
  const h = readHash();
  if(h.api && /^https:\/\//.test(h.api)) ls(LS_API, h.api === OFFICE_API_URL ? null : h.api);
  if(location.hash) history.replaceState(null, '', location.pathname + location.search); // 코드가 주소창에 남지 않도록
  API = ls(LS_API) || OFFICE_API_URL || '';   // 초대 링크로 받은 주소 → 기본 주소 순서
  if(!API){ screenSetup(); return; }
  const code = h.code || ls(LS_CODE);
  const cached = code ? cachedView(code) : null;
  if(cached){ // 저장된 화면을 바로 보여주고 최신 정보는 뒤에서 받아옴
    CODE = code; openPortal(cached);
    fetchView(code).then(v=>{ cacheView(v); CustomerPortal.update(v); }).catch(ex=>{ if(!ex.network){ ls(LS_CODE, null); try{ localStorage.removeItem(viewKey(code)); }catch(e){} screenLogin(ex.message); } });
    return;
  }
  if(code){
    app.innerHTML = entryShell('고객 전용 페이지', '<p class="mw-loading">예식 정보를 불러오는 중</p>');
    try{ const view = await fetchView(code); CODE = code; if(h.code) ls(LS_CODE, code); openPortal(view); return; }
    catch(ex){ screenLogin(ex.message, h.code||''); return; }
  }
  screenLogin();
})();
</script>
